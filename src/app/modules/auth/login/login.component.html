<div class="login">
  <h2 class="login__title">Sign in</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <app-form-input
      [label]="'Username'"
      [control]="loginForm.controls['username']"
      [placeholder]="'Enter your username'"
      [submitted]="submitted"
    ></app-form-input>

    <app-form-input
      [label]="'Password'"
      [control]="loginForm.controls['password']"
      [type]="'password'"
      [placeholder]="'Enter your password'"
      [submitted]="submitted"
    ></app-form-input>

    <!-- Backend error -->
    <div class="error backend-error" role="alert" *ngIf="backendError">
      {{ backendError }}
    </div>

    <app-button type="default" nativeType="submit" [disabled]="loading">
      {{ loading ? "Signing in..." : "Sign in" }}
    </app-button>
  </form>
</div>
